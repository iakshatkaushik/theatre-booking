<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse all movies currently showing at CineVerse Theatre. Search by title, language, or genre.">
  <title>Movies — CineVerse Theatre</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <section class="section">
    <div class="container">
      <h1 class="section-title">🎬 Now Showing</h1>
      <p class="section-subtitle">Find your next favourite movie</p>

      <!-- Search -->
      <div class="search-bar">
        <div class="search-input-wrap">
          <span class="icon">🔍</span>
          <input type="text" id="search-input" placeholder="Search movies by title, language, or genre..." onkeyup="debounceSearch()">
        </div>
      </div>

      <!-- Movie Grid -->
      <div class="movie-grid" id="movie-grid">
        <div class="loading-overlay"><div class="spinner"></div><p>Loading movies...</p></div>
      </div>

      <!-- Pagination -->
      <div id="pagination"></div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('navbar').innerHTML = renderNavbar('movies');
    document.getElementById('footer').innerHTML = renderFooter();

    let searchTimeout;
    let currentPage = 1;

    function debounceSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => { currentPage = 1; loadMovies(); }, 400);
    }

    async function loadMovies(page) {
      if (page) currentPage = page;
      const search = document.getElementById('search-input').value;
      try {
        const res = await Api.getMovies({ search, page: currentPage, limit: 8 });
        const movies = res.data;

        if (!movies || movies.length === 0) {
          document.getElementById('movie-grid').innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="icon">🎬</div><p>No movies found</p></div>';
          document.getElementById('pagination').innerHTML = '';
          return;
        }

        const movieIcons = ['🎬', '🎥', '🎞️', '🎭', '🌟', '🔥', '💫', '⭐'];
        document.getElementById('movie-grid').innerHTML = movies.map((m, idx) => `
          <div class="card movie-card" onclick="window.location.href='/shows.html?movie_id=${m.id}'">
            <div class="movie-poster">${movieIcons[idx % movieIcons.length]}</div>
            <div class="movie-info">
              <h3 class="movie-title">${m.title}</h3>
              <div class="movie-meta">
                ${m.genre?.map(g => `<span class="movie-badge">${g}</span>`).join('') || ''}
                <span class="movie-badge language">${m.language}</span>
                <span class="movie-badge duration">${m.duration_minutes} min</span>
              </div>
              ${m.description ? `<p class="text-muted mt-1" style="font-size:0.8rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${m.description}</p>` : ''}
            </div>
          </div>
        `).join('');

        document.getElementById('pagination').innerHTML = renderPagination(res.pagination, 'loadMovies');
      } catch (err) {
        document.getElementById('movie-grid').innerHTML = '<div class="empty-state" style="grid-column:1/-1"><p>Failed to load movies</p></div>';
      }
    }

    loadMovies();
  </script>
</body>
</html>
