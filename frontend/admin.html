<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Admin Dashboard — CineVerse Theatre Management">
  <title>Admin Dashboard — CineVerse Theatre</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <section class="section">
    <div class="container">
      <h1 class="section-title">⚙️ Admin Dashboard</h1>
      <p class="section-subtitle">Manage movies, shows, bookings, and revenue</p>

      <div id="admin-check">
        <div class="loading-overlay"><div class="spinner"></div><p>Checking permissions...</p></div>
      </div>

      <div id="admin-content" style="display:none">
        <!-- Tabs -->
        <div class="tabs">
          <button class="tab active" onclick="switchTab('revenue')">📊 Revenue</button>
          <button class="tab" onclick="switchTab('movies')">🎬 Movies</button>
          <button class="tab" onclick="switchTab('shows')">🕐 Shows</button>
          <button class="tab" onclick="switchTab('bookings')">🎫 Bookings</button>
        </div>

        <!-- TAB: Revenue -->
        <div id="tab-revenue">
          <div class="flex-between mb-3" style="flex-wrap:wrap;gap:12px">
            <h2 style="font-family:'Playfair Display',serif;color:var(--accent-gold)">Revenue Report</h2>
            <div class="flex gap-1" style="flex-wrap:wrap">
              <input type="date" class="form-input" id="rev-from" style="width:auto">
              <input type="date" class="form-input" id="rev-to" style="width:auto">
              <button class="btn btn-primary btn-sm" onclick="loadRevenue()">Filter</button>
            </div>
          </div>

          <div class="dashboard-grid" id="revenue-stats">
            <div class="card stat-card"><div class="stat-value" id="stat-revenue">₹0</div><div class="stat-label">Total Revenue</div></div>
            <div class="card stat-card"><div class="stat-value" id="stat-bookings">0</div><div class="stat-label">Total Bookings</div></div>
          </div>

          <div id="revenue-details" class="mt-3"></div>
        </div>

        <!-- TAB: Movies -->
        <div id="tab-movies" style="display:none">
          <div class="admin-form-section">
            <h3>Add New Movie</h3>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
              <div class="form-group"><label class="form-label">Title *</label><input class="form-input" id="movie-title" placeholder="Movie title"></div>
              <div class="form-group"><label class="form-label">Language *</label><input class="form-input" id="movie-lang" placeholder="e.g. English"></div>
              <div class="form-group"><label class="form-label">Duration (min) *</label><input class="form-input" id="movie-duration" type="number" placeholder="120"></div>
              <div class="form-group"><label class="form-label">Genres * (comma separated)</label><input class="form-input" id="movie-genre" placeholder="Action, Drama, Thriller"></div>
              <div class="form-group" style="grid-column:1/-1"><label class="form-label">Description</label><textarea class="form-input" id="movie-desc" rows="2" placeholder="Movie description"></textarea></div>
            </div>
            <button class="btn btn-primary" onclick="addMovie()">Add Movie</button>
          </div>

          <h3 style="margin-bottom:16px;color:var(--text-secondary)">All Movies</h3>
          <div id="admin-movies-list">
            <div class="loading-overlay"><div class="spinner"></div></div>
          </div>
        </div>

        <!-- TAB: Shows -->
        <div id="tab-shows" style="display:none">
          <div class="admin-form-section">
            <h3>Create New Show</h3>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
              <div class="form-group"><label class="form-label">Movie *</label><select class="form-select" id="show-movie"><option value="">Select movie</option></select></div>
              <div class="form-group"><label class="form-label">Hall *</label>
                <select class="form-select" id="show-hall">
                  <option value="">Select hall</option>
                  <option value="1">Audi 1 - Grand</option>
                  <option value="2">Audi 2 - Premium</option>
                  <option value="3">Audi 3 - IMAX</option>
                  <option value="4">Audi 4 - Compact</option>
                  <option value="5">Audi 5 - VIP Lounge</option>
                </select>
              </div>
              <div class="form-group"><label class="form-label">Date & Time *</label><input class="form-input" id="show-datetime" type="datetime-local"></div>
              <div class="form-group"><label class="form-label">Standard Price (₹)</label><input class="form-input" id="price-standard" type="number" value="150"></div>
              <div class="form-group"><label class="form-label">Premium Price (₹)</label><input class="form-input" id="price-premium" type="number" value="250"></div>
              <div class="form-group"><label class="form-label">VIP Price (₹)</label><input class="form-input" id="price-vip" type="number" value="400"></div>
              <div class="form-group"><label class="form-label">Balcony Price (₹)</label><input class="form-input" id="price-balcony" type="number" value="350"></div>
              <div class="form-group"><label class="form-label">Box Price (₹)</label><input class="form-input" id="price-box" type="number" value="500"></div>
            </div>
            <button class="btn btn-primary" onclick="createShow()">Create Show</button>
          </div>
        </div>

        <!-- TAB: Bookings -->
        <div id="tab-bookings" style="display:none">
          <div id="admin-bookings">
            <div class="loading-overlay"><div class="spinner"></div></div>
          </div>
          <div id="booking-pagination"></div>
        </div>
      </div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('navbar').innerHTML = renderNavbar('admin');
    document.getElementById('footer').innerHTML = renderFooter();

    // Auth check
    if (!Api.isLoggedIn() || !Api.isAdmin()) {
      document.getElementById('admin-check').innerHTML = `
        <div class="empty-state">
          <div class="icon">🔒</div>
          <p>Admin access required</p>
          <button class="btn btn-primary mt-3" onclick="showAuthModal('login')">Login as Admin</button>
        </div>
      `;
    } else {
      document.getElementById('admin-check').style.display = 'none';
      document.getElementById('admin-content').style.display = 'block';
      loadRevenue();
    }

    // Tab switching
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      ['revenue', 'movies', 'shows', 'bookings'].forEach(t => {
        document.getElementById('tab-' + t).style.display = t === tab ? 'block' : 'none';
      });
      if (tab === 'movies') loadAdminMovies();
      if (tab === 'bookings') loadAdminBookings();
      if (tab === 'shows') populateMovieSelect();
    }

    // ─── Revenue ─────────────────────────────────
    async function loadRevenue() {
      try {
        const from = document.getElementById('rev-from').value;
        const to = document.getElementById('rev-to').value;
        const params = {};
        if (from) params.from = from;
        if (to) params.to = to;

        const res = await Api.getRevenue(params);
        const data = res.data;

        document.getElementById('stat-revenue').textContent = formatCurrency(data.total_revenue);
        document.getElementById('stat-bookings').textContent = data.total_bookings;

        let detailsHtml = '';
        if (data.revenue_by_movie && data.revenue_by_movie.length > 0) {
          detailsHtml += `
            <div class="admin-form-section">
              <h3>Revenue by Movie</h3>
              <div class="table-container">
                <table>
                  <thead><tr><th>Movie</th><th style="text-align:right">Revenue</th></tr></thead>
                  <tbody>
                    ${data.revenue_by_movie.map(r => `<tr><td>${r.movie}</td><td style="text-align:right;font-weight:600;color:var(--accent-gold)">${formatCurrency(r.revenue)}</td></tr>`).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          `;
        }
        document.getElementById('revenue-details').innerHTML = detailsHtml;
      } catch (err) {
        Toast.error('Failed to load revenue data');
      }
    }

    // ─── Movies Management ───────────────────────
    async function loadAdminMovies() {
      try {
        const res = await Api.getMovies({ limit: 50 });
        const movies = res.data || [];

        if (movies.length === 0) {
          document.getElementById('admin-movies-list').innerHTML = '<div class="empty-state"><p>No movies yet</p></div>';
          return;
        }

        document.getElementById('admin-movies-list').innerHTML = `
          <div class="table-container">
            <table>
              <thead><tr><th>ID</th><th>Title</th><th>Language</th><th>Duration</th><th>Genre</th><th>Actions</th></tr></thead>
              <tbody>
                ${movies.map(m => `
                  <tr>
                    <td>${m.id}</td>
                    <td style="font-weight:600">${m.title}</td>
                    <td>${m.language}</td>
                    <td>${m.duration_minutes} min</td>
                    <td>${m.genre?.join(', ') || ''}</td>
                    <td><button class="btn btn-danger btn-sm" onclick="deleteMovie(${m.id})">Delete</button></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      } catch (err) {
        Toast.error('Failed to load movies');
      }
    }

    async function addMovie() {
      const title = document.getElementById('movie-title').value;
      const language = document.getElementById('movie-lang').value;
      const duration_minutes = parseInt(document.getElementById('movie-duration').value);
      const genre = document.getElementById('movie-genre').value.split(',').map(g => g.trim()).filter(Boolean);
      const description = document.getElementById('movie-desc').value || undefined;

      if (!title || !language || !duration_minutes || genre.length === 0) {
        Toast.warning('Please fill all required fields');
        return;
      }

      try {
        await Api.createMovie({ title, language, duration_minutes, genre, description });
        Toast.success('Movie added!');
        document.getElementById('movie-title').value = '';
        document.getElementById('movie-lang').value = '';
        document.getElementById('movie-duration').value = '';
        document.getElementById('movie-genre').value = '';
        document.getElementById('movie-desc').value = '';
        loadAdminMovies();
      } catch (err) {
        Toast.error(err.message || 'Failed to add movie');
      }
    }

    async function deleteMovie(id) {
      if (!confirm('Are you sure you want to delete this movie?')) return;
      try {
        await Api.deleteMovie(id);
        Toast.success('Movie deleted');
        loadAdminMovies();
      } catch (err) {
        Toast.error(err.message);
      }
    }

    // ─── Shows Management ────────────────────────
    async function populateMovieSelect() {
      const select = document.getElementById('show-movie');
      try {
        const res = await Api.getMovies({ limit: 50 });
        select.innerHTML = '<option value="">Select movie</option>' +
          (res.data || []).map(m => `<option value="${m.id}">${m.title}</option>`).join('');
      } catch (err) {}
    }

    async function createShow() {
      const movie_id = parseInt(document.getElementById('show-movie').value);
      const hall_id = parseInt(document.getElementById('show-hall').value);
      const show_datetime = document.getElementById('show-datetime').value;

      if (!movie_id || !hall_id || !show_datetime) {
        Toast.warning('Please fill all required fields');
        return;
      }

      const pricing = [
        { seat_category: 'STANDARD', price: parseFloat(document.getElementById('price-standard').value) || 150 },
        { seat_category: 'PREMIUM', price: parseFloat(document.getElementById('price-premium').value) || 250 },
        { seat_category: 'VIP', price: parseFloat(document.getElementById('price-vip').value) || 400 },
        { seat_category: 'BALCONY', price: parseFloat(document.getElementById('price-balcony').value) || 350 },
        { seat_category: 'BOX', price: parseFloat(document.getElementById('price-box').value) || 500 },
      ];

      try {
        await Api.createShow({ movie_id, hall_id, show_datetime, pricing });
        Toast.success('Show created!');
      } catch (err) {
        Toast.error(err.message || 'Failed to create show');
      }
    }

    // ─── Bookings Management ─────────────────────
    let bookingPage = 1;

    async function loadAdminBookings(page) {
      if (page) bookingPage = page;
      try {
        const res = await Api.getAdminBookings({ page: bookingPage, limit: 10 });
        const bookings = res.data || [];

        if (bookings.length === 0) {
          document.getElementById('admin-bookings').innerHTML = '<div class="empty-state"><p>No bookings yet</p></div>';
          return;
        }

        document.getElementById('admin-bookings').innerHTML = `
          <div class="table-container">
            <table>
              <thead><tr><th>ID</th><th>User</th><th>Movie</th><th>Show</th><th>Seats</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead>
              <tbody>
                ${bookings.map(b => `
                  <tr>
                    <td style="font-weight:600;color:var(--accent-gold)">#${b.id}</td>
                    <td>${b.user?.name || 'N/A'}<br><small class="text-muted">${b.user?.email || ''}</small></td>
                    <td>${b.show?.movie?.title || 'N/A'}</td>
                    <td>${b.show ? formatTime(b.show.show_datetime) : 'N/A'}<br><small class="text-muted">${b.show ? formatDate(b.show.show_datetime) : ''}</small></td>
                    <td>${(b.booking_seats || []).map(bs => `${bs.seat?.row_number || ''}${bs.seat?.seat_number || ''}`).join(', ')}</td>
                    <td style="font-weight:600">${formatCurrency(b.total_amount)}</td>
                    <td><span class="status-badge ${b.status.toLowerCase()}">${b.status}</span></td>
                    <td>${b.status === 'CONFIRMED' ? `<button class="btn btn-danger btn-sm" onclick="cancelBookingAdmin(${b.id})">Cancel</button>` : '-'}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;

        document.getElementById('booking-pagination').innerHTML = renderPagination(res.pagination, 'loadAdminBookings');
      } catch (err) {
        Toast.error('Failed to load bookings');
      }
    }

    async function cancelBookingAdmin(id) {
      if (!confirm('Cancel this booking?')) return;
      try {
        await Api.cancelBooking(id);
        Toast.success('Booking cancelled');
        loadAdminBookings();
      } catch (err) {
        Toast.error(err.message);
      }
    }
  </script>
</body>
</html>
