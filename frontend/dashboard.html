<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage your bookings at CineVerse Theatre.">
  <title>My Bookings — CineVerse Theatre</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <section class="section">
    <div class="container">
      <h1 class="section-title">🎫 My Bookings</h1>
      <p class="section-subtitle">View and manage your theatre bookings</p>

      <div id="bookings-content">
        <div class="loading-overlay"><div class="spinner"></div><p>Loading bookings...</p></div>
      </div>

      <div id="pagination"></div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('navbar').innerHTML = renderNavbar('dashboard');
    document.getElementById('footer').innerHTML = renderFooter();

    if (!Api.isLoggedIn()) {
      document.getElementById('bookings-content').innerHTML = `
        <div class="empty-state">
          <div class="icon">🔒</div>
          <p>Please login to view your bookings</p>
          <button class="btn btn-primary mt-3" onclick="showAuthModal('login')">Login</button>
        </div>
      `;
    }

    let currentPage = 1;

    async function loadBookings(page) {
      if (!Api.isLoggedIn()) return;
      if (page) currentPage = page;

      try {
        const res = await Api.getMyBookings({ page: currentPage, limit: 10 });
        const bookings = res.data;

        if (!bookings || bookings.length === 0) {
          document.getElementById('bookings-content').innerHTML = `
            <div class="empty-state">
              <div class="icon">🎫</div>
              <p>No bookings yet</p>
              <a href="/shows.html" class="btn btn-primary mt-3">Book Now</a>
            </div>
          `;
          return;
        }

        document.getElementById('bookings-content').innerHTML = `
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Movie</th>
                  <th>Show Time</th>
                  <th>Hall</th>
                  <th>Seats</th>
                  <th>Amount</th>
                  <th>Status</th>
                  <th>Booked On</th>
                </tr>
              </thead>
              <tbody>
                ${bookings.map(b => `
                  <tr>
                    <td style="font-weight:600;color:var(--accent-gold)">#${b.id}</td>
                    <td>${b.show?.movie?.title || 'N/A'}</td>
                    <td>${b.show ? formatTime(b.show.show_datetime) + '<br><small class="text-muted">' + formatDate(b.show.show_datetime) + '</small>' : 'N/A'}</td>
                    <td>${b.show?.hall?.name || 'N/A'}</td>
                    <td>
                      <div style="display:flex;flex-wrap:wrap;gap:4px">
                        ${(b.booking_seats || []).map(bs => `
                          <span class="checkout-seat-tag" style="font-size:0.7rem;padding:2px 6px">${bs.seat?.row_number || ''}${bs.seat?.seat_number || ''}</span>
                        `).join('')}
                      </div>
                    </td>
                    <td style="font-weight:600">${formatCurrency(b.total_amount)}</td>
                    <td><span class="status-badge ${b.status.toLowerCase()}">${b.status === 'CONFIRMED' ? '✓' : '✕'} ${b.status}</span></td>
                    <td><small class="text-muted">${formatDate(b.created_at)}</small></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;

        document.getElementById('pagination').innerHTML = renderPagination(res.pagination, 'loadBookings');
      } catch (err) {
        document.getElementById('bookings-content').innerHTML = '<div class="empty-state"><p>Failed to load bookings</p></div>';
      }
    }

    if (Api.isLoggedIn()) loadBookings();
  </script>
</body>
</html>
